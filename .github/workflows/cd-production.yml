name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: "Full 40-character Git SHA of the staging-verified image to promote"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    env:
      CONFIRM_SHA: ${{ inputs.confirm_sha }}
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate production promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$CONFIRM_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test -n "$DEPLOY_HOOK"
          test -n "$PRODUCTION_URL"
          docker manifest inspect "ghcr.io/n-nu/inkwell-server:${CONFIRM_SHA}" >/dev/null

          match=$(gh api \
            "repos/n-nu/inkwell/actions/workflows/cd-staging.yml/runs?branch=main&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.head_sha == env.CONFIRM_SHA) | .id' | head -n 1)
          test -n "$match"

      - name: Trigger Render production deployment
        env:
          IMAGE_URL: ghcr.io/n-nu/inkwell-server:${{ inputs.confirm_sha }}
        run: |
          ENCODED_IMAGE=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$IMAGE_URL")
          if [[ "$DEPLOY_HOOK" == *"?"* ]]; then
            SEPARATOR="&"
          else
            SEPARATOR="?"
          fi
          curl -fsS --max-time 30 -X POST "${DEPLOY_HOOK}${SEPARATOR}imgURL=${ENCODED_IMAGE}" >/dev/null

      - name: Wait for production readiness
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 20 "${PRODUCTION_URL%/}/api/health" >/dev/null; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Run production smoke tests
        run: |
          curl -fsS --max-time 30 "${PRODUCTION_URL%/}/api/health"
          curl -fsS --max-time 30 "${PRODUCTION_URL%/}/api/posts?page=1"

