name: Staging Uptime Check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check-staging:
    runs-on: ubuntu-latest
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - name: Check staging health
        run: |
          test -n "$STAGING_URL"
          for attempt in $(seq 1 8); do
            if curl -fsS --max-time 120 "${STAGING_URL%/}/api/health"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

