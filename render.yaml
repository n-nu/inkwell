services:
  - type: web
    name: inkwell-staging
    runtime: image
    plan: free
    image:
      url: ghcr.io/n-nu/inkwell-server:5b1dd7952a1f196fcb89a99394cee3490819887d
      creds:
        fromRegistryCreds:
          name: ghcr-read-packages
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inkwell-db
          property: connectionString
      - key: NODE_ENV
        value: staging
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true

  - type: web
    name: inkwell-production
    runtime: image
    plan: free
    image:
      url: ghcr.io/n-nu/inkwell-server:5b1dd7952a1f196fcb89a99394cee3490819887d
      creds:
        fromRegistryCreds:
          name: ghcr-read-packages
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inkwell-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true

databases:
  - name: inkwell-db
    plan: free
